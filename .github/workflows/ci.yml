# Roadmap P0.3 (#74) — the three gates every change has to pass:
#   verify  → typecheck, eslint and the unit suite (what `pnpm test` runs).
#   web     → `pnpm export:web`, the production bundle, as a smoke test.
#   rules   → the Firestore/Storage security rules against the emulator.
#
# pnpm/setup (the successor of pnpm/action-setup, required for pnpm 11+) also
# installs the Node runtime, so there is no separate setup-node step.
#
# db/firebaseConfig.ts is not in git, so scripts/ensure-firebase-config.mjs
# writes it from the placeholder values below (the same path Vercel uses).
# Nothing in CI connects to Firebase with them — they only have to satisfy
# the typechecker and the bundler.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FIREBASE_API_KEY: ci-placeholder
  FIREBASE_AUTH_DOMAIN: setuno-ci.firebaseapp.com
  FIREBASE_PROJECT_ID: setuno-ci
  FIREBASE_STORAGE_BUCKET: setuno-ci.appspot.com
  FIREBASE_MESSAGING_SENDER_ID: "000000000000"
  FIREBASE_APP_ID: "1:000000000000:web:0000000000000000"

jobs:
  verify:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v1
        with:
          version: 12
          runtime: node@22
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      # App and services import ./firebaseConfig, which is not in git.
      - run: node scripts/ensure-firebase-config.mjs
      - run: pnpm typecheck
      # Not `pnpm lint`: expo lint has been observed to exit 0 with real
      # findings (handoff §10), so the gate calls the project's eslint directly.
      - run: pnpm exec eslint .
      - run: pnpm test

  web:
    name: Web export smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v1
        with:
          version: 12
          runtime: node@22
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      # Runs ensure-firebase-config.mjs itself, then bundles for production.
      - run: pnpm export:web

  rules:
    name: Security rules (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v1
        with:
          version: 12
          runtime: node@22
          cache: true
          install: false
      # The Firebase CLI dropped Java < 21 for the emulators.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Cache the emulator binaries and firebase-tools' npm download
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/firebase/emulators
            ~/.npm
          key: firebase-ci-${{ runner.os }}
      - run: pnpm install --frozen-lockfile
      # Through npx, the same convention as package.json's deploy:* scripts:
      # run 1 proved that `npm install -g firebase-tools` succeeds while its
      # global bin directory stays off PATH (exit code 127 on `firebase`), and
      # npx resolves the binary itself with no PATH assumption. It starts the
      # emulators, exports their host variables, runs the suite and tears
      # everything down. The integration project runs its files serially
      # (vitest.config.mts) because they share one data store.
      - run: npx -y firebase-tools@latest emulators:exec --only firestore,storage 'pnpm test:integration'
